[project]
name = "zero-dependency"
version = "0.1.0"
description = "Zero-dependency Python dependency investigation tool"
readme = "README.md"
authors = [
    { name = "K.Akshay Reddy", email = "akshaysunny2006@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
pyxray = "pyxray.cli:main"

[project.urls]
Repository = "https://github.com/Anirudh-12/Zero-Dependency"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pyxray*"]

[tool.zero-dep]
track = "A"
pitch = "A zero-dependency CLI that reconstructs and investigates your Python dependency graph from installed metadata and AST — no packages required."
