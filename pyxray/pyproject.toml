[project]
name = "pyxray"
version = "0.1.0"
description = "Zero-dependency Python dependency investigation tool"
readme = "README.md"
authors = [
    { name = "K.Anirudh Reddy", email = "anirudhreddykallem2008@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pyxray = "pyxray.cli:main"

[project.urls]
Repository = "https://github.com/akshayjith4/pyxray"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = ["."]
include = ["pyxray*"]

[tool.zero-dep]
track = "A"
pitch = "A zero-dependency CLI that reconstructs and investigates your Python dependency graph from installed metadata and AST — no packages required."
